name: Build LGL Mod Menu (NDK)

on:
  workflow_dispatch:   # تشغيل يدوي
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d          # نسخة مستقرة جيدة
          add-to-path: true

      - name: Build with ndk-build
        working-directory: app/src/main/jni
        run: |
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk -j$(nproc)

      - name: List built libraries
        run: |
          echo "=== Built libraries ==="
          find app/src/main/jni/libs -type f -name "*.so" || true
          ls -la app/src/main/jni/libs/*/ || true

      - name: Upload .so files
        uses: actions/upload-artifact@v4
        with:
          name: LGL-libs
          path: |
            app/src/main/jni/libs/armeabi-v7a/*.so
            app/src/main/jni/libs/arm64-v8a/*.so
          if-no-files-found: warn
