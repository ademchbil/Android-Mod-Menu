name: Build LGL Mod Menu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK & Build Tools
      run: |
        echo y | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "build-tools;33.0.2" "cmake;3.22.1"

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Compiled APK
      uses: actions/upload-artifact@v4
      with:
        name: LGL-Mod-Menu-APK
        path: app/build/outputs/apk/debug/*.apk
        
